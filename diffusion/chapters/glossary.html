  const Q = [["√(Dt)가 같으면 같은 결과를 낸다는 생각의 이름은?",["열 예산","편석","채널링","DIBL"],0,"1장."],["2D 무작위 걸음 N번 뒤 한 축 방향 RMS 거리는?",["N","N/2","√N·2","√(N/2)"],3,"2장."],["B·P 확산의 주된 동반 결함은?",["전위","석출물","자기 틈새 원자","공공만"],2,"3장."],["총량이 고정된 드라이브인 분포는?",["직선","가우스","erfc","지수"],1,"4장."],["As 고농도 확산 분포가 상자형이 되는 이유는?",["D가 농도에 따라 커져서","고용도가 낮아서","산화 때문","채널링 때문"],0,"5장."],["산화가 B 확산을 빠르게 하는 현상은?",["ORD","TED","BTBT","OED"],3,"6장."],["주입 시 웨이퍼를 7° 기울이는 이유는?",["도즈 증가","온도 감소","채널링 억제","손상 감소"],2,"7장."],["낮은 온도의 어닐에서 TED가 오히려 큰 이유는?",["산화 때문","틈새 원자가 오래 남아서","D가 커서","고용도가 커서"],1,"8장."],["밀리초 어닐의 장점은?",["확산 없이 높은 온도로 활성화","장비가 싸다","균일도 무관","산화막 성장"],0,"9장."],["배치 퍼니스 양 끝의 더미 웨이퍼 역할은?",["도펀트 공급","가스 차단","무게 균형","열 손실 영역을 대신 맡음"],3,"10장."],["철이 도펀트보다 훨씬 빨리 확산하는 이유는?",["전하가 없어서","산화 때문","순수 틈새 확산","무거워서"],2,"11장."],["양산 에피를 전달 지배 영역에서 하는 이유는?",["도핑 불필요","온도 불균일에 둔감","원료 절약","결함 제거"],1,"12장."],["자동 도핑을 줄이는 방법은?",["뒷면 산화막 봉인","후속 열처리 증가","상압 성장","As 기판"],0,"12장."],["SiGe에서 Ge 조성을 올리면 임계 두께는?",["늘어난다","같다","0이 된다","줄어든다"],3,"12장."],["접합을 절반으로 얕게 하면서 R_s를 유지하려면?",["시간 2배","기판 도핑 감소","활성 농도 약 2배","도즈 절반"],2,"13장."],["할로의 주된 목적은?",["게이트 누설 감소","짧은 채널 효과 억제","저항 감소","커패시턴스 감소"],1,"13장."],["p쪽 도핑을 크게 올릴 때 급증하는 누설은?",["BTBT","SRH만","게이트 누설","열전자"],0,"13장."],["4탐침에서 안쪽 바늘로 전압을 재는 이유는?",["전류 증가","속도","손상 감소","접촉 저항 배제"],3,"14장."],["SIMS 측정이 실제보다 뒤쪽 꼬리가 긴 이유는?",["산화","잡음","knock-on 혼합","확산"],2,"14장."],["1 µm 이상 깊은 웰에 알맞은 열처리는?",["열처리 없음","퍼니스 드라이브인","레이저","스파이크"],1,"15장."]];
  let score = 0, done = 0;
  document.getElementById('qz').innerHTML = Q.map((q,i) => `<div class="quiz" data-a="${q[2]}"><p class="q" data-n="${i+1}">${q[0]}</p><ol>${q[1].map(o => `<li>${o}</li>`).join('')}</ol><p class="explain">${q[3]}</p></div>`).join('');
  J.$$('#qz .quiz').forEach(qe => J.$$('li', qe).forEach((li, k) => li.addEventListener('click', () => {
    if(qe.dataset.scored) return; qe.dataset.scored = 1; done++;
