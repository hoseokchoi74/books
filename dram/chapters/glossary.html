    ['센스 앰프가 증폭에 쓰는 원리는?', ['음의 되먹임','양의 되먹임(래치)','변압기','저항 분배'], 1, '4장.'],
    ['로우 버퍼 충돌 지연은?', ['CL','tRCD+CL','tRP+tRCD+CL','tRAS'], 2, '6장.'],
    ['DDR5-4800의 클록 주파수는?', ['4800 MHz','2400 MHz','1200 MHz','600 MHz'], 1, '7장: DDR은 클록당 2회 전송.'],
    ['DDR5 DIMM이 32비트 서브채널 두 개로 나뉜 이유는?', ['전력 때문에','BL16에서 64바이트 접근 단위를 맞추려고','ECC 때문에','리프레시 때문에'], 1, '7장: 16 × 32비트 = 64바이트.'],
    ['FR-FCFS의 우선순위 첫 번째 기준은?', ['도착 순서','로우 버퍼 히트 여부','요청 크기','뱅크 번호'], 1, '8장.'],
    ['6F² 셀을 가능하게 한 비트라인 구조는?', ['폴디드','오픈','계층형','듀얼'], 1, '5장.'],
    ['셀 커패시터 지름을 절반으로 줄이면서 C_s를 유지하려면 높이는?', ['절반','같음','2배','4배'], 2, '9장: A ≈ πDH.'],
    ['리던던시가 없다면 대용량 칩 수율은?', ['거의 0에 가깝다','100 %','50 %','변화 없음'], 0, '10장: 수만 개 매트 중 하나만 불량이어도 버려야 한다.'],
    ['해밍 (7,4) 부호로 할 수 있는 것은?', ['2비트 정정','1비트 정정','오류 감지만','압축'], 1, '11장.'],
    ['HBM이 높은 대역폭을 얻는 주된 방법은?', ['핀 하나를 50 Gb/s로','버스 폭을 1024–2048비트로 넓힘','셀을 키움','리프레시 제거'], 1, '12장.'],
    ['LLM 디코딩이 메모리에 묶이는 이유는?', ['연산 강도가 낮아서','ECC 때문에','온도 때문에','tFAW 때문에'], 0, '12장 루프라인.']
  ];
  let score = 0, done = 0;
  document.getElementById('qz').innerHTML = Q.map((q,i) => `<div class="quiz" data-a="${q[2]}"><p class="q" data-n="${i+1}">${q[0]}</p><ol>${q[1].map(o => `<li>${o}</li>`).join('')}</ol><p class="explain">${q[3]}</p></div>`).join('');
  J.$$('#qz .quiz').forEach(qe => J.$$('li', qe).forEach((li, k) => li.addEventListener('click', () => {
    if(qe.dataset.scored) return; qe.dataset.scored = 1; done++;
    if(k === +qe.dataset.a) score++;
    document.getElementById('score').textContent = `${score} / ${Q.length}`;
    document.getElementById('done').textContent = done + (done === Q.length ? (score >= 13 ? ' · 집현전 학사 合格!' : score >= 9 ? ' · 잘했어요' : ' · 다시 읽어 보기') : '');
  })));
})();
</script>
