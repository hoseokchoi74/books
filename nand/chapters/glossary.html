  .gsearch{width:100%; font-size:16px; padding:11px 14px; border:1.5px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); font-family:var(--sans)}
  .gsearch:focus{outline:none; border-color:var(--plum)}
  .gfilter{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px}
  .glist{display:grid; gap:8px}

<body data-ch="glossary">
<div id="top"></div>
<div class="layout">
<nav class="toc" id="toc"></nav>
<main class="chapter">

<header class="chead">
  <div class="kicker">Chapter 13 <span class="hanja">第十三章 · 結</span></div>
  <h1>용어집 & 종합 퀴즈</h1>
  <p class="lead">책 전체의 핵심 용어를 한곳에 모았다. 검색하거나 분류로 걸러 보고, 마지막의 종합 문제로 실력을 점검해 보자.</p>
</header>

<h2 id="s1"><span class="n">01</span>용어집</h2>
<input class="gsearch" id="gq" placeholder="용어 검색 (예: ISPP, WAF, 전하 트랩)" aria-label="용어 검색">
<div class="gfilter" id="gf"></div>
<p class="hint" id="gcount"></p>
<div class="glist" id="gl"></div>

<h2 id="s2"><span class="n">02</span>종합 퀴즈</h2>
<p>15문제. 각 문제를 누르면 바로 채점되고 해설이 열린다.</p>
<div class="readouts" style="margin-bottom:10px"><div class="ro"><span class="k">점수</span><span class="v score" id="score">0 / 15</span></div><div class="ro"><span class="k">푼 문제</span><span class="v" id="done">0</span></div></div>
<div id="qz"></div>

<div id="pager"></div>
</main>
</div>

<script>
const G = [
 ['플래시 메모리','flash memory','절연막에 갇힌 전하로 정보를 저장하는 비휘발성 메모리. 블록 단위로 빠르게 지운다.','기초','flash'],
 ['비휘발성','non-volatile','전원을 꺼도 데이터가 유지되는 성질.','기초','flash'],
 ['NOR 플래시','NOR flash','셀을 병렬로 연결해 바이트 단위 무작위 읽기가 빠른 플래시. 코드 저장용.','기초','flash'],
 ['NAND 플래시','NAND flash','셀을 직렬 스트링으로 꿰어 집적도를 극대화한 플래시. SSD의 저장 매체.','기초','flash'],
 ['페이지','page','읽기·프로그램 단위. 워드라인 하나의 셀 묶음(약 16 KB).','기초','flash'],
 ['블록','block','소거 단위. 웰(채널)을 공유하는 페이지 묶음(수십 MB).','기초','flash'],
 ['플로팅 게이트','floating gate, FG','터널 산화막 위의 고립된 도체 저장층. 2D NAND의 주류.','소자','cell'],
 ['전하 트랩','charge trap flash, CTF','질화막 같은 절연체 트랩에 전자를 저장하는 셀. 3D NAND의 주류.','소자','cell'],
 ['문턱 전압','threshold voltage, V_th','셀이 켜지기 시작하는 게이트 전압. 저장 전하에 따라 이동한다.','소자','cell'],
 ['결합비','gate coupling ratio','제어 게이트 전압이 저장층에 전달되는 비율 C_CG/C_total.','소자','cell'],
 ['터널 산화막','tunnel oxide','채널과 저장층 사이의 얇은 산화막(~7 nm). 전자가 터널링으로 오간다.','소자','cell'],
 ['블로킹 막','blocking dielectric','저장층과 게이트 사이의 두꺼운 절연막. 전하가 게이트로 새는 것을 막는다.','소자','cell'],
 ['FN 터널링','Fowler–Nordheim tunneling','강한 전계로 기울어진 삼각 장벽을 전자가 뚫는 현상. 프로그램·소거 메커니즘.','동작','program'],
 ['ISPP','Incremental Step Pulse Programming','펄스 전압을 조금씩 올리며 검증하는 프로그램 방식. 분포 폭 ≈ ΔV_pp.','동작','program'],
 ['검증','program verify','펄스 뒤 목표 V_th 도달 여부를 읽어 확인하고, 통과한 셀을 금지시키는 단계.','동작','program'],
 ['과소거','over-erase','소거가 지나쳐 V_th가 너무 낮아진 상태.','동작','program'],
 ['tPROG / tR / tBERS','program / read / block erase time','프로그램·읽기·블록 소거 시간 사양.','동작','program'],
 ['스트링','NAND string','SSL–셀들–GSL로 직렬 연결된 단위. 비트라인과 공통 소스 사이에 놓인다.','구조','string'],
 ['V_pass','pass voltage','읽기·프로그램 시 비선택 셀을 켜 두는 전압.','구조','string'],
 ['셀프 부스팅','self-boosting program inhibit','금지 스트링의 채널을 띄워 정전 결합으로 끌어올려 프로그램을 막는 기법.','구조','string'],
 ['플레인','plane','독립된 페이지 버퍼를 가진 어레이 단위. 동시 동작 가능.','구조','string'],
 ['페이지 버퍼','page buffer','비트라인을 감지하고 데이터를 잠시 담는 회로.','구조','string'],
 ['SLC/MLC/TLC/QLC','single/multi/triple/quad-level cell','셀당 1/2/3/4비트를 저장하는 방식.','다중레벨','mlc'],
 ['RBER','raw bit error rate','ECC 이전의 원시 비트 오류율.','다중레벨','mlc'],
 ['그레이 코드','Gray code','이웃 상태끼리 한 비트만 다르게 한 부호화.','다중레벨','mlc'],
 ['리드 리트라이','read retry','읽기 기준 전압을 옮겨 다시 읽어 오류를 줄이는 동작.','다중레벨','mlc'],
 ['3D NAND / V-NAND','vertical NAND','워드라인을 수백 층 쌓고 수직 채널 홀로 셀을 만든 구조.','3D','vnand'],
 ['채널 홀','channel hole','적층을 관통하는 홀. 벽에 셀 막질과 채널이 증착된다.','3D','vnand'],
 ['계단 콘택','staircase contact','각 워드라인 층에 콘택을 내리기 위한 계단 구조.','3D','vnand'],
 ['다중 데크','string stacking','스택을 여러 번 나눠 쌓고 뚫어 잇는 방법.','3D','vnand'],
 ['CMOS 언더 어레이','CMOS under array','주변 회로를 셀 어레이 아래에 두는 구조.','3D','vnand'],
 ['웨이퍼 본딩','wafer bonding (CBA)','셀 웨이퍼와 CMOS 웨이퍼를 따로 만들어 접합하는 방식.','3D','vnand'],
 ['내구성','endurance','셀이 견디는 P/E 사이클 수.','신뢰성','reliability'],
 ['P/E 사이클','program/erase cycle','프로그램과 소거 한 번씩의 묶음.','신뢰성','reliability'],
 ['리텐션','data retention','전원 없이 데이터를 유지하는 능력과 시간.','신뢰성','reliability'],
 ['읽기 교란','read disturb','반복 읽기의 V_pass 스트레스로 비선택 셀 V_th가 오르는 현상.','신뢰성','reliability'],
 ['셀 간 간섭','cell-to-cell interference','이웃 셀의 전하 변화가 V_th를 옮기는 현상.','신뢰성','reliability'],
 ['리드 리클레임','read reclaim','읽기가 많은 블록을 새 블록으로 옮겨 쓰는 관리.','신뢰성','reliability'],
 ['BCH','Bose–Chaudhuri–Hocquenghem code','정해진 t개까지 오류를 고치는 대수적 부호.','ECC','ecc'],
 ['LDPC','low-density parity-check code','성긴 패리티 행렬로 정의되어 반복 복호로 강력하게 정정하는 부호.','ECC','ecc'],
 ['태너 그래프','Tanner graph','비트 노드와 검사 노드로 부호를 나타낸 그래프.','ECC','ecc'],
 ['LLR','log-likelihood ratio','비트가 0일 가능성과 1일 가능성의 로그 비. 소프트 정보.','ECC','ecc'],
 ['UBER','uncorrectable bit error rate','ECC 후 남는 오류율. 목표 10⁻¹⁵ 이하.','ECC','ecc'],
 ['FTL','Flash Translation Layer','논리 주소를 물리 페이지로 변환하고 GC·마모를 관리하는 펌웨어.','시스템','ftl'],
 ['가비지 컬렉션','garbage collection, GC','유효 페이지를 옮기고 블록을 지워 빈 공간을 만드는 과정.','시스템','ftl'],
 ['쓰기 증폭','write amplification, WAF','NAND 쓰기량 ÷ 호스트 쓰기량.','시스템','ftl'],
 ['오버프로비저닝','over-provisioning, OP','사용자에게 보이지 않는 여분 용량.','시스템','ftl'],
 ['웨어 레벨링','wear leveling','블록별 지우기 횟수를 고르게 맞추는 기법.','시스템','ftl'],
 ['TRIM','TRIM / Deallocate','호스트가 더 이상 쓰지 않는 LBA를 알려 주는 명령.','시스템','ftl'],
 ['채널·웨이','channel / way','컨트롤러–NAND 버스와 그 버스를 공유하는 다이들.','SSD','ssd'],
 ['SLC 캐시','SLC cache','일부 블록을 SLC로 써서 빠르게 받아 두는 영역.','SSD','ssd'],
 ['NVMe','Non-Volatile Memory Express','PCIe 위의 SSD 전용 명령 체계. 다수의 깊은 큐.','SSD','ssd'],
 ['HMB','Host Memory Buffer','DRAM 없는 SSD가 호스트 메모리 일부를 빌려 쓰는 기능.','SSD','ssd'],
 ['TBW / DWPD','terabytes written / drive writes per day','SSD 수명 동안 쓸 수 있는 총량과 하루 전체 덮어쓰기 횟수.','SSD','playground'],
 ['ZNS','Zoned Namespace','존 단위 순차 쓰기로 장치 GC를 줄이는 인터페이스.','트렌드','future'],
 ['PLC','penta-level cell','셀당 5비트 저장 방식.','트렌드','future']
];
(function(){
  const cats = ['전체', ...new Set(G.map(g => g[3]))];
  let cat = '전체';
  const gf = document.getElementById('gf'), gl = document.getElementById('gl'), gq = document.getElementById('gq');
  gf.innerHTML = cats.map(c => `<button class="sbtn ${c==='전체'?'on':''}" data-c="${c}">${c}</button>`).join('');
  const chn = s => BOOK.chapters.find(c => c.slug === s).n;
  function render(){
    const q = gq.value.trim().toLowerCase();
    const list = G.filter(g => (cat === '전체' || g[3] === cat) && (!q || (g[0]+g[1]+g[2]).toLowerCase().includes(q)));
    gl.innerHTML = list.map(g => `<div class="gi"><a class="ch" href="${g[4]}.html">Ch.${chn(g[4])} →</a><b>${g[0]}</b><span class="en">${g[1]}</span><p>${g[2]}</p></div>`).join('') || '<p class="hint">찾는 용어가 없습니다.</p>';
    document.getElementById('gcount').textContent = `${list.length}개 용어`;
  }
  gf.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; J.$$('button', gf).forEach(x => x.classList.remove('on')); b.classList.add('on'); cat = b.dataset.c; render(); });
  gq.addEventListener('input', render);
  render();

  const Q = [
    ['NAND가 NOR보다 집적도가 높은 이유는?', ['셀이 커서','직렬 스트링으로 콘택 수를 줄여서','전압이 높아서','커패시터가 없어서'], 1, '1장.'],
    ['저장층에 전자를 넣으면 V_th는?', ['내려간다','올라간다','그대로','0이 된다'], 1, '2장: ΔV_th = Nq/C.'],
    ['3D NAND가 주로 전하 트랩을 쓰는 이유가 아닌 것은?', ['결함에 강함','얇게 증착 가능','채널 홀 벽에 한 번에 형성','전자가 도체 안에서 자유롭게 움직여서'], 3, '자유롭게 움직이는 것은 FG의 약점이다.'],
    ['ISPP에서 분포 폭을 정하는 주 요인은?', ['V_start','ΔV_pp','블록 크기','소거 전압'], 1, '3장.'],
    ['NAND의 소거 단위는?', ['비트','페이지','블록','다이'], 2, '1·3장.'],
    ['스트링 읽기에서 비선택 셀에 거는 전압은?', ['0 V','V_read','V_pass','V_pgm'], 2, '4장.'],
    ['QLC의 상태 수는?', ['4','8','16','32'], 2, '5장: 2⁴ = 16.'],
    ['그레이 코드의 목적은?', ['속도','이웃 상태 오판 시 1비트만 틀리게','소거 없애기','전압 낮추기'], 1, '5장.'],
    ['3D NAND 밀도를 높이는 주된 수단은?', ['평면 미세화','층 적층','셀당 전자 감소','DRAM 추가'], 1, '6장.'],
    ['리텐션 가속 시험의 원리는?', ['전압 상승','아레니우스 온도 가속','ECC 끄기','읽기 반복'], 1, '7장.'],
    ['읽기 교란이 주로 올리는 것은?', ['높은 상태 V_th','소거 상태 V_th','블록 크기','tPROG'], 1, '7장.'],
    ['소프트 읽기의 대가는?', ['수명 감소','지연 증가','용량 감소','전압 상승'], 1, '8장.'],
    ['OP를 늘리면 WAF는?', ['늘어난다','줄어든다','변화 없다','0이 된다'], 1, '9장: WAF ≈ (1+OP)/(2·OP).'],
    ['QD = 64, 지연 200 µs일 때 IOPS는?', ['12,800','320,000','64,000','3,200,000'], 1, '10장: 64 / 200 µs = 320,000.'],
    ['ZNS가 줄이는 것이 아닌 것은?', ['장치 WAF','OP','매핑 DRAM','셀당 비트 수'], 3, '11장.']
  ];
  let score = 0, done = 0;
  document.getElementById('qz').innerHTML = Q.map((q,i) => `<div class="quiz" data-a="${q[2]}"><p class="q" data-n="${i+1}">${q[0]}</p><ol>${q[1].map(o => `<li>${o}</li>`).join('')}</ol><p class="explain">${q[3]}</p></div>`).join('');
  J.$$('#qz .quiz').forEach(qe => J.$$('li', qe).forEach((li, k) => li.addEventListener('click', () => {
    if(qe.dataset.scored) return; qe.dataset.scored = 1; done++;
    if(k === +qe.dataset.a) score++;
    document.getElementById('score').textContent = `${score} / ${Q.length}`;
    document.getElementById('done').textContent = done + (done === Q.length ? (score >= 13 ? ' · 집현전 학사 合格!' : score >= 9 ? ' · 잘했어요' : ' · 다시 읽어 보기') : '');
  })));
})();
</script>
</body>
</html>
