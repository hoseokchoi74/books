  gf.innerHTML = cats.map(c => `<button class="sbtn ${c==='전체'?'on':''}" data-c="${c}">${c}</button>`).join('');
  const chn = s => BOOK.chapters.find(c => c.slug === s).n;
  function render(){
    const q = gq.value.trim().toLowerCase();
    const list = G.filter(g => (cat === '전체' || g[3] === cat) && (!q || (g[0]+g[1]+g[2]).toLowerCase().includes(q)));
    gl.innerHTML = list.map(g => `<div class="gi"><a class="ch" href="${g[4]}.html">Ch.${chn(g[4])} →</a><b>${g[0]}</b><span class="en">${g[1]}</span><p>${g[2]}</p></div>`).join('') || '<p class="hint">찾는 용어가 없습니다.</p>';
    document.getElementById('gcount').textContent = `${list.length}개 용어`;
  }
  gf.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; J.$$('button', gf).forEach(x => x.classList.remove('on')); b.classList.add('on'); cat = b.dataset.c; render(); });
  gq.addEventListener('input', render);
  render();
  const Q = [["WIP 18만 장, 하루 투입 2,000장이면 사이클 타임은?",["9일","90일","900일","2일"],1,"1장. CT = WIP/TH."],["CMOS 로직 웨이퍼의 표준 결정면은?",["(111)","(110)","(100)","(211)"],2,"2장."],["k₀ < 1 도펀트의 잉곳 꼬리 쪽 농도는?",["낮다","높다","같다","0"],1,"2장. 샤일 식."],["입자가 작을수록 떼기 어려운 이유는?",["붙는 힘이 떼는 힘보다 천천히 줄어서","무거워서","정전기 때문","녹아서"],0,"3장."],["두꺼운 산화막의 성장은?",["t에 비례","√t에 비례","t²에 비례","일정"],1,"4장."],["드라이브인에서 보존되는 양은?",["표면 농도","총 도즈","접합 깊이","D"],1,"5장."],["BF₂⁺로 주입하는 이유는?",["붕소를 얕게 넣으려고","빠르게","싸게","깊게"],0,"5장."],["최소 피치 λ/(NA(1+σ)): ArF, NA 0.85, σ 0.6이면?",["227 nm","142 nm","90 nm","60 nm"],1,"6장."],["NA를 키우면 DOF는?",["커진다","그대로","NA²에 반비례해 준다","NA에 비례"],2,"6장."],["스윙 곡선의 원인은?",["기판 반사로 생긴 정재파","렌즈 수차","먼지","온도"],0,"6장."],["SADP의 최종 피치는 처음 맨드릴 피치의?",["2배","같음","½","¼"],2,"7장."],["같은 노광량에서 EUV 광자 수는 ArF의?",["14배","같음","1/14","1/2"],2,"7장."],["이방성을 높이는 식각 조건은?",["고압·저바이어스","저압·고바이어스","라디칼 비중 ↑","고온"],1,"8장."],["좁은 구멍이 얕게 파이는 현상은?",["ARDE","디싱","언더컷","채널링"],0,"8장."],["깊은 구멍에 고른 막을 원하면?",["부착 계수 크게","부착 계수 작게 (ALD)","PVD","온도 낮게"],1,"9장."],["프레스턴 식에서 P 2배, v 2배면 연마 속도는?",["2배","4배","1배","8배"],1,"10장."],["구리 배선에 다마신을 쓰는 이유는?",["구리 건식 식각이 어려워서","싸서","빨라서","투명해서"],0,"11장."],["HfO₂(k=20) 2 nm의 EOT는?",["2 nm","0.39 nm","10 nm","0.1 nm"],1,"12장. 2×3.9/20."],["μ가 규격 중앙에서 벗어나면 줄어드는 지수는?",["Cp","Cpk","둘 다 그대로","σ"],1,"13장."],["결함이 뭉쳐 있을 때 실제 수율은 푸아송 예측보다?",["높다","낮다","같다","0"],0,"13장."]];
  let score = 0, done = 0;
  document.getElementById('qz').innerHTML = Q.map((q,i) => `<div class="quiz" data-a="${q[2]}"><p class="q" data-n="${i+1}">${q[0]}</p><ol>${q[1].map(o => `<li>${o}</li>`).join('')}</ol><p class="explain">${q[3]}</p></div>`).join('');
  J.$$('#qz .quiz').forEach(qe => J.$$('li', qe).forEach((li, k) => li.addEventListener('click', () => {
    if(qe.dataset.scored) return; qe.dataset.scored = 1; done++;
    if(k === +qe.dataset.a) score++;
    document.getElementById('score').textContent = `${score} / ${Q.length}`;
    document.getElementById('done').textContent = done + (done === Q.length ? (score >= 17 ? ' · 집현전 학사 合格!' : score >= 12 ? ' · 잘했어요' : ' · 다시 읽어 보기') : '');
  })));
})();
</script>
